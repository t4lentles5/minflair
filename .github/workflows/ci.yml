name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'release-*'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate component manifest
        run: python config/quickshell/Scripts/minflair_components.py validate --repo-root .

      - name: Compile Python sources
        run: python -m compileall -q config/quickshell/Scripts tests

      - name: Bash syntax
        run: |
          bash -n bootstrap.sh install.sh update.sh lib/*.sh

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error bootstrap.sh install.sh update.sh lib/*.sh

  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
