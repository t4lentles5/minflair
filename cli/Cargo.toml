[package]
name = "minflair"
version = "2.3.0"
edition = "2021"
rust-version = "1.75"
description = "Minflair installer, updater and diagnostics"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
